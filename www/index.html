<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7b1530">
<title>10mo Nivel · USGP</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0e0e11;--card:#1a1a20;--tx:#f4f4f6;--mut:#9a9aa6;--ac:#c2234f;--ok:#3ecf8e;--bd:#2a2a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f6;--card:#fff;--tx:#17171c;--mut:#666672;--bd:#e0e0e6;--ac:#9c1b40}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:46px;height:46px;border-radius:10px}
h1{font-size:26px;margin:0;line-height:1.1}
.sub{color:var(--mut);font-size:13px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;font:inherit;transition:transform .15s}
.card:active{transform:scale(.98)}
.card b{display:block;font-size:15px;margin-bottom:6px}
.checks{font-size:13px;color:var(--ok);letter-spacing:1px;min-height:16px;word-break:break-all}
.time{font-size:15px;font-weight:700;color:var(--ac);white-space:nowrap;text-align:right}
.time small{display:block;color:var(--mut);font-weight:400;font-size:11px}
#detail{display:none}
#detail.show{display:block;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
.back{background:none;border:0;color:var(--ac);font:inherit;font-size:15px;cursor:pointer;padding:6px 0;margin-bottom:8px}
h2{font-size:20px;margin:0 0 4px}
.phase{display:inline-block;margin:14px 0 6px;padding:5px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600}
.ringbox{position:relative;width:240px;height:240px;margin:8px auto}
.ringbox svg{transform:rotate(-90deg)}
.clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.btns button{padding:14px 8px;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#fff}
#go{background:var(--ac)}#pause{background:#5a5a66}#stop{background:#44444f}#fin{background:#1f9d6a}.total{font-size:30px;font-weight:700;color:var(--ac);margin:4px 0 10px}
.stats{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}
.stats div{margin:4px 0}
#msg{position:fixed;left:50%;top:22%;transform:translate(-50%,-30px);background:var(--ac);color:#fff;padding:16px 22px;border-radius:16px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:.4s;z-index:20;width:min(88vw,380px)}
#msg.on{opacity:1;transform:translate(-50%,0)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div id="msg"></div>
<div class="wrap">
<div id="home">
<header><img src="icons/icon-192.png" alt="USGP"><div><h1>10mo Nivel</h1><div class="sub">Medicina · USGP</div></div></header>
<div id="list"></div>
</div>
<div id="detail">
<button class="back" id="back">‹ Materias</button>
<h2 id="dt"></h2>
<div style="text-align:center"><span class="phase" id="ph">Listo para estudiar</span></div>
<div class="ringbox">
<svg width="240" height="240"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--bd)" stroke-width="12"/><circle id="arc" cx="120" cy="120" r="108" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="678.6"/></svg>
<div class="clock" id="clk">00:00</div>
</div>
<div class="btns"><button id="go">▶ Inicio</button><button id="pause">⏸ Pausa</button><button id="stop">■ Parar</button><button id="fin">✓ Terminar aquí</button></div>
<div class="stats"><div>Tiempo Total de Estudio</div><div class="total" id="tt">0 s</div><div>Pomodoros completos: <b id="pc">0</b></div><div class="checks" id="ck"></div></div>
</div>
</div>
<script>
var SUBJ=[["bio","Bioestadísticas"],["bioe","Bioética y Salud"],["tic","Desarrollo del Trabajo de Integración Curricular"],["red","Redacción Científica III"],["tall","Taller Preparatorio de las Modalidades de Integración Curricular"]];
var KEY="usgp10mo",S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
SUBJ.forEach(function(s){if(!S[s[0]])S[s[0]]={sec:0,pom:0}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fmt(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60,o="";if(h)o+=h+" h ";if(h||m)o+=m+" min ";if(!h)o+=s+" s";return o.trim()}
function $(i){return document.getElementById(i)}
function renderList(){
 $("list").innerHTML="";
 SUBJ.forEach(function(s){
  var d=S[s[0]],b=document.createElement("button");b.className="card";
  b.innerHTML="<div><b>"+s[1]+"</b><div class='checks'>"+"✓".repeat(Math.min(d.pom,40))+"</div></div><div class='time'>"+fmt(d.sec)+"<small>"+d.pom+" 🍅</small></div>";
  b.onclick=function(){openSubj(s)};$("list").appendChild(b)});
}
var cur=null,phase="idle",paused=false,el0=0,t0=0,iv=null,R=678.6;
var ORD=["","1er","2do","3er","4to","5to","6to","7mo","8vo","9no","10mo"];
function ord(n){return n<=10?ORD[n]:n+"º"}
function openSubj(s){
 cur=s;$("home").style.display="none";var d=$("detail");d.classList.remove("show");void d.offsetWidth;d.style.display="block";d.classList.add("show");
 $("dt").textContent=s[1];reset();refresh();window.scrollTo(0,0);
}
$("back").onclick=function(){reset();$("detail").style.display="none";$("detail").classList.remove("show");$("home").style.display="block";renderList()};
function refresh(){var d=S[cur[0]];$("tt").textContent=fmt(d.sec);$("pc").textContent=d.pom;$("ck").textContent="✓".repeat(Math.min(d.pom,40))}
function draw(el,tot){var m=Math.floor(el/60),s=Math.floor(el%60);$("clk").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;$("arc").style.strokeDashoffset=R*(1-Math.min(el/tot,1))}
function elapsed(){return paused?el0:el0+(Date.now()-t0)/1000}
function reset(){clearInterval(iv);phase="idle";paused=false;el0=0;$("pause").textContent="⏸ Pausa";$("ph").textContent="Listo para estudiar";draw(0,1500);if(cur)refresh()}
$("go").onclick=function(){if(phase!=="idle")return;phase="study";paused=false;el0=0;t0=Date.now();$("ph").textContent="📖 Estudio · 25 min";iv=setInterval(tick,500);tick()};
$("pause").onclick=function(){if(phase==="idle")return;
 if(!paused){el0=elapsed();paused=true;clearInterval(iv);$("pause").textContent="▶ Reanudar";$("ph").textContent+=" · en pausa"}
 else{paused=false;t0=Date.now();$("pause").textContent="⏸ Pausa";$("ph").textContent=phase==="study"?"📖 Estudio · 25 min":"☕ Descanso · 5 min";iv=setInterval(tick,500);tick()}};
$("stop").onclick=function(){if(phase==="idle")return;reset()};
$("fin").onclick=function(){if(phase==="idle")return;
 if(phase==="study"){var s=Math.floor(Math.min(elapsed(),1500));if(s>0){S[cur[0]].sec+=s;save();banner("✓ Guardado: "+fmt(s))}}
 else banner("Descanso terminado");
 reset()};
function tick(){
 var now=Date.now(),el=el0+(now-t0)/1000,tot=phase==="study"?1500:300;
 if(el>=tot){
  if(phase==="study"){
   S[cur[0]].sec+=1500;save();draw(1500,1500);
   banner("🎉 Felicidades completaste el "+ord(S[cur[0]].pom+1)+" Pomodoro");confetti();
   phase="break";el0=0;t0=now;$("ph").textContent="☕ Descanso · 5 min";refresh();return;
  }
  clearInterval(iv);S[cur[0]].pom++;save();phase="idle";draw(300,300);
  $("ph").textContent="✓ Pomodoro guardado";banner("✓ Pomodoro completo guardado");refresh();return;
 }
 draw(el,tot);
}
function banner(t){var m=$("msg");m.textContent=t;m.classList.add("on");setTimeout(function(){m.classList.remove("on")},4500)}
function confetti(){
 var c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 var cols=["#c2234f","#fff","#f5c542","#3ecf8e","#4aa3ff","#ff7a45"],P=[];
 for(var i=0;i<160;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,vx:-2+Math.random()*4,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%cols.length]});
 var f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
 if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}
renderList();
</script>
</body>
</html>
